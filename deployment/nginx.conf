worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip settings
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SSL Configuration (assuming certbot)
    server {
        listen 80;
        server_name apeiskole.lk www.apeiskole.lk;

        # Certbot challenge path
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name apeiskole.lk www.apeiskole.lk;

        ssl_certificate /etc/letsencrypt/live/apeiskole.lk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/apeiskole.lk/privkey.pem;

        # SSL optimization
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Increase upload limit for media uploads
        client_max_body_size 50M;

        # --- KEYCLOAK ---
        location /auth {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # --- BACKEND API ---
        location /api {
            proxy_pass http://backend:8080/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- PGADMIN ---
        location /db {
            proxy_pass http://pgadmin:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /db;
        }

        # --- FRONTEND (DigitalOcean App Platform Proxy) ---
        location / {
            proxy_pass https://ape-iskole-frontend-9lwoj.ondigitalocean.app;
            proxy_set_header Host ape-iskole-frontend-9lwoj.ondigitalocean.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # For Vite/React apps, handle routing
            proxy_intercept_errors on;
            error_page 404 = @fallback;
            
            # Proxying HTTPS to HTTPS
            proxy_ssl_server_name on;
        }

        location @fallback {
            rewrite ^ /index.html break;
            proxy_pass https://ape-iskole-frontend-9lwoj.ondigitalocean.app;
            proxy_set_header Host ape-iskole-frontend-9lwoj.ondigitalocean.app;
            proxy_ssl_server_name on;
        }
    }
}
